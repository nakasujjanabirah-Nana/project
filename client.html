<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIENT PAGE</title>
</head>
<body>
    <nav><a href="main.html">main</a></nav>
    <h1>CLIENT PAGE</h1>
    <section>
        <h2>Add client</h2>
        <form data-endpoint="/api/clients">
            <label>First name <input name="first_name" autocomplete="given-name" required></label><br> <br>
            <label>Last name <input name="last_name" autocomplete="family-name" required></label><br> <br>
            <label>Address <input name="address" autocomplete="street-address" required></label><br> <br>
            <label>Contact <input name="contact" type="tel" autocomplete="tel" required></label><br> <br>
            <label>Gender
                <select name="gender" required>
                    <option value="">Select gender</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="other">Other</option>
                    <option value="prefer not to say">Prefer not to say</option>
                </select>
            </label><br> <br>
            <button type="submit">Save client</button>
            <p data-form-message role="status" aria-live="polite"></p>
        </form>
        
    </section>

</body>
</html>
