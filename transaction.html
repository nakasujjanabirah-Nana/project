<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transactions</title>
</head>
<body>
    <nav><a href="main.html">main</a></nav>
    <h1>Transactions</h1>
    <section>
        <h2>Make a transaction</h2>
        <form data-endpoint="/api/transactions">
            <label>Type
                <select name="transaction_type" required>
                    <option value="">Select transaction type</option>
                    <option value="deposit">Deposit</option>
                    <option value="withdrawal">Withdrawal</option>
                    <option value="transfer">Transfer</option>
                </select>
            </label><br> <br>
            <label>Account
                <select name="account_number" data-options="/api/accounts"
                    data-value-field="account_number" data-label-fields="account_number,account_holder"
                    required>
                    <option value="">Select account</option>
                </select>
            </label><br> <br>
            <label data-transfer-field hidden>Receiving account
                <select name="receiver_account" data-options="/api/accounts"
                    data-value-field="account_number" data-label-fields="account_number,account_holder">
                    <option value="">Select receiving account</option>
                </select>
            </label><br> <br>
            <label>Amount <input name="amount" type="number" min="0.01" step="0.01" required></label><br> <br>
            <button type="submit">Submit transaction</button>
    
        </form>
    </section>
</body>
</html>
