<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f6fb">
    <title>Accounts | Mobile Banking</title>
    <script src="/static/app.js" defer></script>
</head>
<body>
    <nav><a href="main.html">main</a></nav>
    <h1>ACCOUNTS</h1>
    <section>
        <h2>Client Login</h2>
        <form method="POST" action="/accounts_login">
            <label>Client ID: <input type="text" name="client_id" required></label><br><br>
            <label>Account Number: <input type="text" name="account_number" required></label><br><br>
            <button type="submit">Login</button>
        </form>
        <h2>Add account</h2>
        <form data-endpoint="/api/accounts">
            <label>Client
                <select name="client_id" data-options="/api/clients" data-value-field="Id"
                    data-label-fields="first_name,last_name,Id" required>
                    <option value="">Select client</option>
                </select>
            </label><br> <br>
            <label>Account type
                <select name="account_type" required>
                    <option value="">Select account type</option>
                    <option value="savings">Savings</option>
                    <option value="checking">Checking</option>
                </select>
            </label><br> <br>
            <label>Branch
                <select name="branch" data-options="/api/branches" data-value-field="branch_name"
                    data-label-fields="branch_name" required>
                    <option value="">Select branch</option>
                </select>
            </label><br> <br>
            <label>Opening date <input name="date" type="date"></label><br> <br>
            <button type="submit">Save account</button>
            <p data-form-message role="status" aria-live="polite"></p>
        </form>
        <div data-records data-endpoint="/api/accounts"></div>
    </section>
  
</body>
</html>
